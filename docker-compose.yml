services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: attendify_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: student_attendance
      MYSQL_USER: attendify_user
      MYSQL_PASSWORD: attendify_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./base.sql:/docker-entrypoint-initdb.d/base.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendify_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendify_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Database Configuration
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: student_attendance
      MYSQL_PORT: 3306
      # App Configuration
      FLASK_DEBUG: "true"
      SECRET_KEY: "your-secret-key-change-in-production"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - attendify_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendify_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BACKEND_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - attendify_network

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  attendify_network:
    driver: bridge
